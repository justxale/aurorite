<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <script type="module" src="https://unpkg.com/rapidoc/dist/rapidoc-min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700" rel="stylesheet">
</head>
<body>
    <rapi-doc
            id="thedoc" spec-url="$specUrl"
            render-style="focused" show-info="true"
            show-header="false" layout="column"
            theme="emerald" color-scheme="dark"
            radius="sm" scale="default" nav-item-spacing="relaxed"
            style="--font-sans: Roboto Mono;" regular-font="Roboto Mono"
            show-method-in-nav-bar="as-colored-block" use-path-in-nav-bar="true">
    </rapi-doc>
</body>
</html>
